# Rebuild the documentation site (https://leoank.github.io/neusis/)
# whenever something it documents changes on main. The site's source
# lives on the gh-pages branch; this checks it out and builds it against
# the commit that was just pushed.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "modules/**"
      - "cli/**"
      - "docs/**"
      - "templates/**"
      - "flake.nix"
      - "flake.lock"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: gh-pages

      - uses: cachix/install-nix-action@v31

      - name: Build
        run: |
          nix build .#site -L --override-input neusis github:leoank/neusis/${{ github.sha }}
          cp -rL result _site
          chmod -R u+w _site

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
