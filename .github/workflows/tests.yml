# neusis test tiers (see docs/testing.md).
#
#   T0  nix-unit eval tests, for the Linux and the Darwin test sets
#       (pure evaluation — the Darwin set evaluates fine on a Linux runner)
#   T1  nix flake check --no-build --all-systems: every machine, home and
#       package check instantiates
#   T2  build the cheap package checks (the Go CLI runs `go test` in its
#       check phase)
#
#   T3  NixOS VM tests (checks.x86_64-linux.vm-*) under KVM, on pushes to
#       main only — they are the slow tier
#
# Darwin system builds (T2 for the machines) are left to the hosts; a
# macOS runner can run `nix build .#checks.aarch64-darwin.darwin-rogue`.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  eval-tests:
    name: T0 nix-unit (${{ matrix.tests }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tests: [x86_64-linux, aarch64-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: nix-unit
        env:
          NEUSIS_TEST_SYSTEM: ${{ matrix.tests }}
        run: nix run .#neusis-test

  flake-check:
    name: T1 nix flake check --no-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - run: nix flake check --no-build --all-systems

  build-packages:
    name: T2 package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - run: nix build --no-link .#checks.x86_64-linux.pkg-neusis .#checks.x86_64-linux.pkg-gclb

  vm-tests:
    name: T3 VM ${{ matrix.test }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: [neusis-os, tailscale, kanata, build-cluster, home-bundle, packages]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            system-features = nixos-test benchmark big-parallel kvm
      - run: nix build --no-link -L .#checks.x86_64-linux.vm-${{ matrix.test }}

