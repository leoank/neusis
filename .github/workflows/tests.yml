# neusis test tiers (see docs/testing.md).
#
#   T0  nix-unit eval tests, for the Linux and the Darwin test sets
#       (pure evaluation — the Darwin set evaluates fine on a Linux runner)
#   T1  every machine, home and package check instantiates (flake check
#       for the runner's system + `nix eval` of every system's checks,
#       which tolerates the import-from-derivation stylix needs)
#   T2  build the cheap package checks (the Go CLI runs `go test` in its
#       check phase)
#
#   T3  NixOS VM tests (checks.x86_64-linux.vm-*) under KVM, on pushes to
#       main only — they are the slow tier
#
# The macOS runner covers the Darwin side natively (T0, T1, package checks).
# Darwin *system* builds (T2 for the machines) are left to the hosts:
# `nix build .#checks.aarch64-darwin.darwin-rogue`.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  eval-tests:
    name: T0 nix-unit (${{ matrix.tests }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tests: [x86_64-linux, aarch64-darwin]
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: nix-unit
        env:
          NEUSIS_TEST_SYSTEM: ${{ matrix.tests }}
        run: nix run .#neusis-test

  flake-check:
    name: T1 eval Linux checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      # `nix flake check` validates `darwinConfigurations.<host>.system` on
      # every runner, and that needs import-from-derivation of an
      # aarch64-darwin derivation (stylix's base16-schemes) that only a
      # Darwin store can realise — so it cannot pass on a Linux runner. The
      # `darwin` job runs the full flake check natively; here we instantiate
      # both Linux systems' checks with `nix eval` (builds nothing).
      - name: instantiate checks for the Linux systems
        run: |
          for sys in x86_64-linux aarch64-linux; do
            echo "== $sys"
            nix eval --raw ".#checks.$sys" --apply \
              'cs: builtins.concatStringsSep "\n" (map (n: "${n}  ${cs.${n}.drvPath}") (builtins.attrNames cs)) + "\n"'
          done

  darwin:
    name: Darwin runner — T0, T1 flake check, T2 packages
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - name: T0 nix-unit (aarch64-darwin, natively)
        run: nix run .#neusis-test
      - name: T1 nix flake check --no-build
        run: |
          # realise the one import-from-derivation input (stylix's base16
          # schemes) so the no-build check can evaluate the Darwin hosts on
          # a cold store
          nix build --no-link .#darwinConfigurations.rogue.pkgs.base16-schemes
          nix flake check --no-build
      - name: T1 instantiate the Darwin checks
        run: |
          nix eval --raw .#checks.aarch64-darwin --apply \
            'cs: builtins.concatStringsSep "\n" (map (n: "${n}  ${cs.${n}.drvPath}") (builtins.attrNames cs)) + "\n"'
      - name: T2 package checks
        run: nix build --no-link .#checks.aarch64-darwin.pkg-neusis .#checks.aarch64-darwin.pkg-gclb

  build-packages:
    name: T2 package checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - run: nix build --no-link .#checks.x86_64-linux.pkg-neusis .#checks.x86_64-linux.pkg-gclb

  vm-tests:
    name: T3 VM ${{ matrix.test }}
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        test: [neusis-os, tailscale, kanata, build-cluster, home-bundle, packages]
    steps:
      - uses: actions/checkout@v4
      - name: Enable KVM for the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
            system-features = nixos-test benchmark big-parallel kvm
      - run: nix build --no-link -L .#checks.x86_64-linux.vm-${{ matrix.test }}

