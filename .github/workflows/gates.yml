# Gates a commit must pass before any deploy group moves to it
# (docs/auto-update-spec.md §6.3): the test ladder (tests.yml, VM tests
# included) plus a full build of every deploy-group member's system and
# homes. update-inputs.yml and pipeline.yml call it with the commit to
# gate (`ref`); dispatch it by hand to gate any ref.
#
# The members come from the registry (lib.autoUpdate.ciMatrix), so a
# machine added to a group is built without editing this file. Linux
# members build natively on the free arm64/x86_64 runners. The OCI base
# image is not built here: make-disk-image needs KVM, which the hosted
# arm64 runners lack, and the image gates no deploy group.
#
# Mac members gate like the rest (§7.2). rogue's closure (~28 GiB) is
# larger than a hosted macOS runner's guaranteed free disk, so the job
# deletes the preinstalled Xcodes and simulators it does not need, and
# it records disk and timings in the job summary.
name: gates

on:
  workflow_call:
    inputs:
      ref:
        description: Commit to gate (default the triggering one).
        type: string
        default: ""
  workflow_dispatch:
    inputs:
      ref:
        description: Commit to gate (default the selected branch).
        type: string
        default: ""

permissions:
  contents: read

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ inputs.ref }}

  plan:
    name: deploy-group build matrix
    runs-on: ubuntu-latest
    outputs:
      machines: ${{ steps.plan.outputs.machines }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}
      - id: plan
        run: |
          machines=$(nix eval --json --impure --expr '
            let f = builtins.getFlake (toString ./.);
            in f.neusis.lib.autoUpdate.ciMatrix {
              groups = f.neusis.registry.deployGroups.anklab;
              inherit (f) checks;
            }' | jq -c '[.[] | . + {
              runner: {
                "aarch64-linux": "ubuntu-24.04-arm",
                "x86_64-linux": "ubuntu-latest",
                "aarch64-darwin": "macos-latest"
              }[.system]
            }]')
          echo "machines=$machines" >> "$GITHUB_OUTPUT"
          echo "$machines" | jq .

  system:
    name: system ${{ matrix.host }} (${{ matrix.group }})
    needs: plan
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.machines) }}
    env:
      SYSTEM: ${{ matrix.system }}
      CHECKS: ${{ toJSON(matrix.checks) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Free disk
        run: |
          before=$(df -k / | awk 'NR == 2 { print $4 }')
          if [ "$RUNNER_OS" = macOS ]; then
            # Nix needs no Xcode; keep only the selected one.
            xcrun simctl delete all || true
            keep=$(xcode-select -p | sed 's|/Contents/Developer$||')
            for x in /Applications/Xcode*.app; do
              [ "$x" = "$keep" ] || sudo rm -rf "$x"
            done
            sudo rm -rf ~/Library/Developer/CoreSimulator ~/Library/Android \
              /usr/local/share/dotnet ~/hostedtoolcache /Users/runner/hostedtoolcache
          else
            sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
              /opt/hostedtoolcache /usr/local/share/boost
          fi
          after=$(df -k / | awk 'NR == 2 { print $4 }')
          echo "FREE_BEFORE_KB=$before" >> "$GITHUB_ENV"
          echo "FREE_AFTER_KB=$after" >> "$GITHUB_ENV"
          df -h /

      - uses: DeterminateSystems/nix-installer-action@v16
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build ${{ join(matrix.checks, ', ') }}
        run: |
          # (macOS runners ship bash 3.2: no mapfile)
          start=$(date +%s)
          status=0
          jq -r --arg s "$SYSTEM" '.[] | ".#checks.\($s).\(.)"' <<<"$CHECKS" \
            | xargs nix build --no-link --print-out-paths -L > outs.txt || status=$?
          echo "BUILD_SECONDS=$(( $(date +%s) - start ))" >> "$GITHUB_ENV"
          exit "$status"

      - name: Record
        if: always()
        run: |
          {
            echo "### ${{ matrix.host }} on ${{ matrix.runner }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| free disk before cleanup | $(( FREE_BEFORE_KB / 1024 / 1024 )) GiB |"
            echo "| free disk after cleanup | $(( FREE_AFTER_KB / 1024 / 1024 )) GiB |"
            echo "| free disk after build | $(df -k / | awk 'NR == 2 { printf "%d", $4 / 1024 / 1024 }') GiB |"
            echo "| build time | ${BUILD_SECONDS:-n/a} s |"
            if [ -s outs.txt ]; then
              while read -r out; do
                echo "| closure of \`$(basename "$out")\` | $(nix path-info -Sh "$out" | awk '{ print $2, $3 }') |"
              done < outs.txt
            fi
          } >> "$GITHUB_STEP_SUMMARY"
