# goreleaser config for the neusis CLI.
# Runs from the cli/ module root. Release with a `v*` git tag.
version: 2

project_name: neusis

before:
  hooks:
    - go mod tidy

builds:
  - id: neusis
    main: .
    binary: neusis
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/leoank/neusis/cli/cmd.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: neusis
    # neusis_linux_amd64.tar.gz, neusis_darwin_arm64.tar.gz, …
    # install.sh depends on this exact naming.
    name_template: "neusis_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: leoank
    name: neusis
  name_template: "neusis {{ .Version }}"

changelog:
  use: github
  sort: asc
